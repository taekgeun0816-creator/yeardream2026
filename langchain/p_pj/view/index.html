<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>당진시 안내 챗봇</title>
  <link rel="stylesheet" href="style.css">
</head>
<script src="https://cdn.jsdelivr.net/npm/axios@1.19.0/dist/axios.min.js"></script>
<body>

  <header>
    <div class="brand">
      <img src="DangjnCity_SymbolMark.jpg" alt="당진시 로고" class="logo">
      <h1>당진시 안내 챗봇</h1>
    </div>
    <p>로컬 AI 모델(Qwen3-4B)로 동작합니다</p>
  </header>

  <main id="chat-log">
    <div class="msg ai">안녕하세요! 당진시에 대해 궁금한 점을 물어보세요.</div>

    <div id="examples">
      <button type="button" class="example">당진시는 어느 도에 있어?</button>
      <button type="button" class="example">당진시 대표 관광지 알려줘</button>
    </div>
  </main>

  <footer>
    <form id="chat-form">
      <input id="question" type="text" placeholder="질문을 입력하세요..." autocomplete="off">
      <button id="send-btn" type="submit">전송</button>
    </form>
    <small>※ AI 답변은 부정확할 수 있어요. 정확한 정보는 당진시청에서 확인하세요.</small>
  </footer>


  <script>
    const chatLog = document.getElementById('chat-log');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('question');
    const sendBtn = document.getElementById('send-btn');

    function addMessage(txt, role) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.textContent = txt;
        chatLog.appendChild(div);
        chatLog.scrollTop = chatLog.scrollHeight;
        return div;
    }

    async function sendQuestion(question) {
        question = question.trim();
        if (!question) {return;}

        addMessage(question, "user")
        const aiDiv = addMessage("답변 생성중...", "ai")

        input.value = ""
        input.disabled = true;
        sendBtn.disabled = true;

        try{
            const res = await axios.post("/chat", {q:question}, {timeout:180000});
            aiDiv.textContent = res.data.answer;
        }catch(err){
            if(err.response){
                aiDiv.textContent =`오류 발생(${err.response.status})`;
            }else if (err.code === "ECONNABORTED"){
                aiDiv.textContent="응답시간 초과. 다시 시도해 주세요"
            }else{
                aiDiv.textContent ='서버에 연결할 수 없습니다.'
            }
        }finally{
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
            chatLog.scrollTop = chatLog.scrollHeight;
        }
    }

        // ── 이벤트 1: 전송 버튼 / Enter ──
    form.addEventListener("submit", (e) => {
      e.preventDefault();                     // 페이지 새로고침 막기
      sendQuestion(input.value);
    });

    // ── 이벤트 2: 예시 질문 버튼 ──
    document.querySelectorAll(".example").forEach((btn) => {
      btn.addEventListener("click", () => sendQuestion(btn.textContent));
    });
  </script>
</body>
</html>
